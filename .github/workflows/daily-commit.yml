name: Daily Auto Commit

on:
  schedule:
    # Runs every day at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual run anytime from GitHub UI

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Daily Activity Log
        run: |
          echo "Last automated repository check: $(date -u)" > LAST_UPDATED.txt

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LAST_UPDATED.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): daily repository activity ping [$(date -u +'%Y-%m-%d')]" && git push)
